name: CyberQuantic Weekly Automation

on:
  schedule:
    - cron: '0 8 * * 1'  # Tous les lundis à 08:00 UTC
  workflow_dispatch:      # Permet de lancer manuellement depuis l'interface

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Pipeline (Send Newsletter & Publish Blog)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: "CyberQuantic Weekly <contact@cyberquantic.com>"
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID_NEWSLETTER: "8f5c0ead-885f-44a6-a4b9-f98279a963d6"
        run: python main.py send

      - name: Commit and Push state.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add state.json || true
          git commit -m "chore: update rotation state [skip ci]" || echo "No changes"
          git push
